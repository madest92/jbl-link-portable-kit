# Проверка и сборка на push и pull request; тег v* — релиз с бинарниками, их скачивают скрипты.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # версия помощника — git describe

      - uses: actions/setup-go@v5
        with:
          go-version-file: assist/go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Скрипты
        run: |
          shellcheck -s sh -e SC1091,SC2012,SC2015,SC2029,SC2174 \
            setup.sh lib/kit.sh adb/*.sh ota/*.sh ssh/*.sh assist/*.sh \
            autostart/*.sh

      - name: Помощник — тесты и сборка
        run: |
          go -C assist test -race -count=1 ./...
          sh assist/build.sh

      - name: Dropbear
        run: sh ssh/build.sh

      - name: Плагин автозапуска
        run: |
          sudo apt-get install -y --no-install-recommends clang lld
          sh autostart/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            assist/build/jbl-assist.gz
            ssh/build/dropbear
            ssh/build/dropbearkey
            autostart/build/flb-in_jbl_boot.so

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/assist/build/jbl-assist.gz
            dist/ssh/build/dropbear
            dist/ssh/build/dropbearkey
            dist/autostart/build/flb-in_jbl_boot.so
