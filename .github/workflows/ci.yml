# Проверка, затем сборка на push и pull request; тег v* — релиз с бинарниками, их скачивают скрипты.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: assist/go.mod

      - name: Lint scripts
        run: git ls-files '*.sh' | xargs shellcheck

      - name: Test assistant
        run: go -C assist test -race -count=1 ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # версия помощника — git describe

      - uses: actions/setup-go@v7
        with:
          go-version-file: assist/go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build assistant
        run: sh assist/build.sh

      - name: Build Dropbear
        run: sh ssh/build.sh

      - name: Build autostart plugin
        run: |
          sudo apt-get install -y --no-install-recommends clang lld
          sh autostart/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            assist/build/jbl-assist.gz
            ssh/build/dropbear
            ssh/build/dropbearkey
            autostart/build/flb-in_jbl_boot.so

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/assist/build/jbl-assist.gz
            dist/ssh/build/dropbear
            dist/ssh/build/dropbearkey
            dist/autostart/build/flb-in_jbl_boot.so
